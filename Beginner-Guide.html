<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#192a30">
<title>鹈鹕挖掘机大作战</title>
<style>
:root{color-scheme:dark;--ink:#162a30;--cream:#fff6dc;--yellow:#ffd04a;--line:#3d5052;--muted:#b8c7c2}
*{box-sizing:border-box}body{margin:0;background:#192a30;color:var(--cream);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:none}button:focus-visible{outline:3px solid #fff1b9;outline-offset:3px}
main{width:min(1240px,calc(100% - 44px));margin:24px auto 22px}.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:13px}.badge{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:var(--yellow);color:var(--ink);flex:none;box-shadow:0 3px #ad791f}.badge svg{width:31px}h1{margin:0;font-size:clamp(1.25rem,3vw,2.05rem);letter-spacing:.025em;line-height:1.18}.subtitle{font-size:.875rem;margin:5px 0 0;color:var(--muted)}.menu{display:flex;gap:7px}.menu button{white-space:nowrap;background:#263b40;border:1px solid var(--line);border-radius:9px;min-height:42px;padding:0 12px;font-size:.875rem}.menu button:hover{background:#334a50}
.yard{position:relative;aspect-ratio:16/9;border:3px solid #111f23;border-radius:16px;overflow:hidden;background:#91d9e9;isolation:isolate;box-shadow:0 6px #101e23}.yard>svg{width:100%;height:100%;display:block}.hud{position:absolute;top:4%;left:2.4%;right:2.4%;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.card{background:#fff8e8;color:#253632;border:2px solid #283e3a;box-shadow:0 3px #233b3970;border-radius:12px;padding:8px 13px;display:flex;align-items:center;gap:10px;font-weight:800}.card small{display:block;font-size:.75rem;line-height:1.25;color:#535f51}.card strong{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}.token{display:grid;place-items:center;border-radius:50%;background:#ffd34e;border:2px solid #ac791e;color:#875511;width:29px;height:29px;font-size:.95rem}.steps{display:flex;gap:4px;margin-top:5px}.steps span{width:21px;height:6px;border-radius:8px;background:#dcd9c7}.steps .done{background:#319377}.prompt{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);text-align:center;padding:8px 15px;border-radius:999px;background:#233331;color:#fff7dc;font-size:clamp(.72rem,1.45vw,.98rem);font-weight:700;width:max-content;max-width:94%;pointer-events:none}.prompt[data-kind=good]{background:#176d56}.prompt[data-kind=warn]{background:#824226}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#162a30a8;text-align:center;padding:12px}.overlay[hidden]{display:none}.dialog{border:3px solid #172d30;border-radius:16px;background:#fff5da;color:#233533;padding:16px 27px;box-shadow:0 5px #192a30}.dialog h2{margin:0;font-size:clamp(1rem,4vw,2rem)}.dialog p{margin:5px 0 10px}.dialog button{padding:8px 18px;border:2px solid #29413a;border-radius:8px;background:var(--yellow);font-weight:800;color:#1b3433}
.controls{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:9px;margin-top:14px;touch-action:none}.group{padding:8px;background:#24383c;border:1px solid var(--line);border-radius:11px;min-width:0}.group h2{margin:0 0 6px;color:#c8d6d0;font-size:.81rem;font-weight:650}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.key{display:flex;justify-content:center;align-items:center;gap:5px;width:100%;min-height:42px;border:1px solid #59706c;border-radius:7px;background:#344d50;font-size:.87rem;white-space:nowrap;padding:0 3px;font-weight:700}.key kbd{font:700 .75rem system-ui;color:#dbe6dc;border:1px solid #7e9289;border-radius:4px;padding:1px 4px}.key:hover,.key.held{background:#476b64}.key.held{transform:translateY(2px)}.action{background:var(--yellow);color:#23322c;border-color:#f5bb37}.action kbd{color:#473d23;border-color:#a0772e}.action:hover,.action.held{background:#ffe388}
@media(max-width:740px){main{width:calc(100% - 18px);margin:12px auto}.mast{margin-bottom:9px}.badge{width:37px;height:37px}.badge svg{width:25px}.brand{gap:8px}.subtitle{font-size:.73rem}.menu button{padding:0 7px;min-height:36px;font-size:.75rem}.yard{border-radius:11px;border-width:2px}.card{padding:4px 7px;border-radius:8px;gap:5px}.card small{font-size:.65rem}.card strong{font-size:1rem}.token{width:21px;height:21px;font-size:.72rem}.steps span{width:13px;height:4px}.prompt{padding:4px 9px}.controls{gap:5px;margin-top:9px}.group{padding:5px}.key{font-size:.75rem;min-height:44px}.key kbd{font-size:.65rem;padding:0 2px}}
@media(max-width:540px){.controls{grid-template-columns:repeat(2,1fr)}.action-group{grid-column:1/-1}.key{font-size:.88rem}.subtitle{display:none}.group h2{margin-bottom:4px}.hud{top:3%}}
@media(min-width:800px) and (min-height:560px){main{width:min(1240px,calc(100% - 44px),calc((100svh - 185px)*16/9))}}
</style>
</head>

        <path d="M-107 462H87v15q0 8-10 8h-176q-8 0-8-8Z" fill="#e79b21"/><path d="M-108 462H87" stroke="#8c6028" stroke-width="3"/>
        <path d="M-99 438h34m-34 7h29m-29 7h24" stroke="#73542e" stroke-width="4" stroke-linecap="round"/>
        <path d="M-55 459v-81q0-14 14-17l49-7q17-1 23 14l23 74-5 17z" fill="url(#gold)" stroke="#343d35" stroke-width="5" stroke-linejoin="round"/>
        <path d="M-46 444v-62q0-9 9-11l45-7q10-1 14 9l22 71z" fill="url(#glass)" stroke="#3b5150" stroke-width="4" stroke-linejoin="round"/>
        <path d="m-42 397 32-29 14-2-46 42z" fill="#e5ffff" opacity=".46"/>

          <ellipse id="eye" cx="-5" cy="392" rx="3.3" ry="4.3" fill="#273638" stroke="none"/><circle cx="-4" cy="391" r="1" fill="white" stroke="none"/>

        </g>
        <path d="m13 442 4-15 9-3" fill="none" stroke="#384748" stroke-width="4" stroke-linecap="round"/>

<script>
'use strict';
const byId = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const goal = 3;
const drop = {left:933, right:1095, top:376, bottom:525};
const terrain = [[484,550],[508,537],[528,517],[548,511],[570,490],[595,482],[617,493],[646,505],[664,522],[690,536],[710,550]];
const buttons = [...document.querySelectorAll('[data-key]')];
const keyboard = new Set();
const pointers = new Map();
const particles = [];
const wheels = [];
const pins = [...byId('pins').children];
const movement = buttons.filter(button => button.dataset.key !== 'Space');
const permitted = new Set([...buttons.map(button => button.dataset.key), 'KeyP','KeyR']);
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const degrees = radians => radians * 180 / Math.PI;
const point = (origin, length, angle) => ({x:origin.x + length * Math.cos(angle), y:origin.y + length * Math.sin(angle)});
const held = key => keyboard.has(key) || [...pointers.values()].includes(key);
const axis = (positive, negative) => Number(held(positive)) - Number(held(negative));
let machine, trips, loaded, paused, complete, settling, notice, noticeTime, usedMotion, clock, track;

function shape(parent, tag, attrs) {
  const node = document.createElementNS(svgNS, tag);
  for (const [key,value] of Object.entries(attrs)) node.setAttribute(key, value);
  parent.append(node);
  return node;
}

for (const x of [-86,-48,-10,28,66]) {
  const wheel = shape(byId('wheels'),'g',{});
  shape(wheel,'circle',{cx:x,cy:522,r:15,fill:'#798479',stroke:'#243536','stroke-width':3});
  shape(wheel,'path',{d:`M${x-9} 522h18m-9-9v18`,stroke:'#344647','stroke-width':3,'stroke-linecap':'round'});
  shape(wheel,'circle',{cx:x,cy:522,r:4,fill:'#b0ae94'});
  wheels.push({node:wheel,x});
}
for (let n=0; n<124; n++) {
  const x = (n*97+24)%1280;
  const y = 562+(n*59)%159;
  const size = 2+n%7;
  shape(byId('groundDetails'),'path',{d:`M${x} ${y}q${size} ${-size/2} ${size*2} -1`,fill:'none',stroke:n%3 ? '#aa774d' : '#fff0bd','stroke-width':n%3+1,'stroke-linecap':'round'});
}

function pose({x,boom,stick,bucket}) {
  const base = {x:x+52,y:409};
  const elbow = point(base,148,boom);
  const stickAngle = boom + stick;
  const wrist = point(elbow,142,stickAngle);
  const angle = stickAngle + bucket;
  const tip = point(point(wrist,44,angle),37,angle+Math.PI/2);
  return {base,elbow,wrist,tip,angle,stickAngle};
}

function pilePoints() {
  return terrain.map(([x,y]) => [x,y + (550-y)*Math.min(.62,(trips+Number(loaded)+Number(settling))*.16)]);
}

function zoneAt(tip) {
  if (tip.x >= drop.left && tip.x <= drop.right && tip.y >= drop.top && tip.y <= drop.bottom) return 'drop';
  const surface = pilePoints();
  const next = surface.findIndex(([x]) => tip.x < x);
  if (next <= 0 || tip.y > 550) return '';
  const [a,b] = [surface[next-1],surface[next]];
  const height = a[1]+(b[1]-a[1])*(tip.x-a[0])/(b[0]-a[0]);
  return tip.y >= height ? 'soil' : '';
}

function align(id, pos, angle=0) {
  byId(id).setAttribute('transform', `translate(${pos.x} ${pos.y}) rotate(${degrees(angle)})`);
}

function render() {
  const {base,elbow,wrist,tip,angle,stickAngle} = pose(machine);
  align('vehicle',{x:machine.x,y:0});
  byId('treads').setAttribute('stroke-dashoffset', -track%16);
  for (const wheel of wheels) wheel.node.setAttribute('transform',`rotate(${track*3.8%360} ${wheel.x} 522)`);
  align('boom',base,machine.boom);
  align('stick',elbow,stickAngle);
  align('bucket',wrist,angle);
  const rodEnd = point(base,98,machine.boom);
  const rodPath = `M${base.x-4} ${base.y+34}L${rodEnd.x} ${rodEnd.y+5}`;
  byId('rodBase').setAttribute('d',rodPath);
  byId('rod').setAttribute('d',rodPath);
  [base,elbow,wrist].forEach((p,i) => {
    pins[i].setAttribute('cx',p.x);
    pins[i].setAttribute('cy',p.y);
  });
  byId('load').setAttribute('visibility',loaded ? 'visible' : 'hidden');
  const ready = !settling && zoneAt(tip) === (loaded ? 'drop' : 'soil');
  byId('tip').setAttribute('cx',tip.x);
  byId('tip').setAttribute('cy',tip.y);
  byId('tip').setAttribute('fill',ready ? '#70e1ae' : '#fff6ca');
  byId('tip').setAttribute('r',ready ? 8 : 6);
  byId('eye').setAttribute('ry',clock%3.7 > 3.55 ? .7 : 4.3);
  const wave = complete ? Math.sin(clock*14)*31 : (axis('KeyD','KeyA') || axis('KeyS','KeyW'))*8;
  byId('wing').setAttribute('transform',`rotate(${wave} -23 426)`);
  const message = noticeTime > 0 ? notice : settling ? ['泥土正在落下…',''] : ready ? [loaded ? '绿点已对准，按空格卸土！' : '绿点已碰到土堆，按空格挖土！','good'] : loaded ? ['运到右侧，让白点进入绿色虚线框。',''] : usedMotion ? ['把白点对准左侧土堆。',''] : ['按住 S 降低动臂，让白点碰到土堆。',''];
  const prompt = byId('prompt');
  if (prompt.textContent !== message[0]) prompt.textContent = message[0];
  prompt.dataset.kind = message[1];
  for (const button of movement) button.classList.toggle('held',held(button.dataset.key));
}

function syncProgress() {
  byId('score').textContent = trips * 100;
  byId('progress').textContent = `${trips} / ${goal}`;
  [...document.querySelectorAll('.steps span')].forEach((step,i) => step.classList.toggle('done',i < trips));
  byId('actionText').textContent = loaded ? '卸土' : '挖土';
  const surface = pilePoints();
  byId('pile').setAttribute('d',`M${surface.join('L')}Z`);
  const lines = surface.map(([x,y]) => [x,Math.min(550,y+13)]).reverse();
  byId('pileTop').setAttribute('d',`M${surface.join('L')}L${lines.join('L')}Z`);
  byId('deposited').setAttribute('d',trips ? `M952 542Q984 ${539-trips*7} 1001 ${537-trips*10}Q1020 ${532-trips*8} 1041 ${539-trips*5}L1079 542Z` : '');
}

function say(message, kind, seconds=2) {
  notice = [message,kind];
  noticeTime = seconds;
}

function burst(pos,color,fall=false) {
  for (let i=0;i<16;i++) {
    const node = shape(byId('effects'),'circle',{cx:pos.x,cy:pos.y,r:fall ? 3+i%4 : 2+i%4,fill:color});
    particles.push({node,x:pos.x,y:pos.y,vx:(Math.random()-.5)*(fall?70:144),vy:fall?20+Math.random()*42:-45-Math.random()*90,life:fall?.9:.55+Math.random()*.2,fall});
  }
}

function act() {
  if (paused || complete || settling) return;
  const {tip} = pose(machine);
  const zone = zoneAt(tip);
  if (!loaded && zone === 'soil') {
    loaded = true;
    burst(tip,'#df9e64');
    say('挖到一铲！按 W 抬臂，按 D 运往卸土区。','good');
  } else if (loaded && zone === 'drop') {
    loaded = false;
    settling = .56;
    noticeTime = 0;
    burst(tip,'#ad653c',true);
  } else {
    say(loaded ? '还不能卸土，让白点进入绿色虚线框。' : '还没挖到，让白点碰到土堆再试。','warn');
  }
  syncProgress();
  render();
}

function showOverlay() {
  byId('overlay').hidden = !paused && !complete;
  byId('pause').textContent = paused ? '继续' : '暂停';
  if (paused || complete) {
    byId('dialogTitle').textContent = complete ? '任务完成！' : '游戏已暂停';
    byId('dialogText').textContent = complete ? `搬运 ${goal} 铲泥土，获得 ${trips*100} 分。` : '按 P 或点击下方按钮继续。';
    byId('dialogButton').textContent = complete ? '再玩一次' : '继续游戏';
  }
}

function clearInput() {
  keyboard.clear();
  pointers.clear();
}

function resetGame() {
  machine = {x:300,boom:-.64,stick:1.63,bucket:-.92};
  trips = settling = noticeTime = clock = track = 0;
  loaded = paused = complete = usedMotion = false;
  clearInput();
  for (const particle of particles.splice(0)) particle.node.remove();
  syncProgress();
  showOverlay();
  render();
}

function togglePause() {
  if (complete) return;
  paused = !paused;
  clearInput();
  showOverlay();
  render();
}

function changeJoint(joint, change, min, max) {
  if (!change) return;
  const current = machine[joint];
  machine[joint] = clamp(current + change,min,max);
  if (pose(machine).tip.y > 550) machine[joint] = current;
}

function update(dt) {
  clock += dt;
  if (!complete) {
    const direction = axis('KeyD','KeyA');
    const boom = axis('KeyS','KeyW');
    const stick = axis('KeyL','KeyJ');
    const bucket = axis('KeyK','KeyI');
    if (direction || boom || stick || bucket) usedMotion = true;
    const nextX = clamp(machine.x + direction*240*dt,122,1157);
    track += nextX - machine.x;
    machine.x = nextX;
    changeJoint('boom',boom*.97*dt,-1.46,.18);
    changeJoint('stick',stick*1.12*dt,.48,2.24);
    changeJoint('bucket',bucket*1.47*dt,-1.85,1.29);
    noticeTime -= dt;
    if (settling) {
      settling = Math.max(0,settling-dt);
      if (!settling) {
        trips++;
        say('卸土成功，+100 分！','good');
        syncProgress();
        if (trips === goal) {
          complete = true;
          clearInput();
          showOverlay();
        }
      }
    }
  }
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx*dt;
    p.vy += (p.fall ? 835 : 230)*dt;
    p.y += p.vy*dt;
    if (p.life <= 0 || p.y >= 548) {
      p.node.remove();
      particles.splice(i,1);
    } else {
      p.node.setAttribute('cx',p.x);
      p.node.setAttribute('cy',p.y);
      p.node.setAttribute('opacity',Math.min(1,p.life*3));
    }
  }
}

document.addEventListener('keydown',event => {
  if (!permitted.has(event.code) || event.ctrlKey || event.altKey || event.metaKey || event.isComposing) return;
  if (event.code === 'Space' && event.target.closest('#overlay button, .menu button')) return;
  event.preventDefault();
  if (event.code === 'KeyP' && !event.repeat) togglePause();
  else if (event.code === 'KeyR' && !event.repeat) resetGame();
  else if (event.code === 'Space' && !event.repeat) act();
  else if (!paused && !complete && !event.repeat) keyboard.add(event.code);
});
document.addEventListener('keyup',event => keyboard.delete(event.code));
window.addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',clearInput);
for (const button of buttons) {
  const key = button.dataset.key;
  if (key === 'Space') {
    button.addEventListener('click',act);
    continue;
  }
  button.addEventListener('pointerdown',event => {
    if (event.button !== 0 || paused || complete) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId,key);
  });
  for (const name of ['pointerup','pointercancel','lostpointercapture']) {
    button.addEventListener(name,event => pointers.delete(event.pointerId));
  }
  button.addEventListener('click',event => {
    if (event.detail || paused || complete) return;
    keyboard.add(key);
    update(.12);
    keyboard.delete(key);
    render();
  });
  button.addEventListener('contextmenu',event => event.preventDefault());
}
byId('pause').addEventListener('click',togglePause);
byId('reset').addEventListener('click',resetGame);
byId('dialogButton').addEventListener('click',() => {
  if (complete) resetGame();
  else togglePause();
});
let previous = performance.now();
function frame(now) {
  const dt = clamp((now-previous)/1000,0,.04);
  previous = now;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(frame);
}
resetGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
