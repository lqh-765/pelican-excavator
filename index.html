<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕挖掘队</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f7f1e5;color:#26332a}
*{box-sizing:border-box}body{margin:0;padding:clamp(14px,4vw,50px)}
main{max-width:1152px;margin:auto}header{margin:0 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.05em}header span{font-size:13px;color:#526453;white-space:nowrap}
.player{overflow:hidden;border-radius:17px;background:#fffaf0;box-shadow:0 12px 32px #4b452122;border:1px solid #ded5bc}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#b4e2dc}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px}
button{font:inherit;font-size:13px;font-weight:650;color:#26332a;background:#f2ead8;border:1px solid #e1d4b4;border-radius:8px;min-height:36px;padding:5px 10px;cursor:pointer}
button:hover{background:#f7ddb0}button:focus-visible,input:focus-visible{outline:3px solid #286e62;outline-offset:2px}
#play{background:#244c40;color:white;min-width:58px;border-color:#244c40}
input{flex:1;min-width:92px;accent-color:#286e62}output{color:#526453;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<main>
<header><h1>鹈鹕挖掘队</h1><span>16:9 · 10 秒</span></header>
<div class="player">
<canvas id="scene" width="1280" height="720" aria-label="卡通动画：一只戴安全帽的鹈鹕驾驶黄色挖掘机挖土、倒土并鸣笛">浏览器需要支持 Canvas 才能播放这段动画。</canvas>
<div class="controls">
<button id="play" type="button">暂停</button>
<button id="restart" type="button">重播</button>
<input id="seek" type="range" min="0" max="10" step="0.01" value="0" aria-label="播放进度（秒）">
<output id="time" for="seek">0.0 / 10 秒</output>
<button id="sound" type="button" aria-pressed="false">开启声音</button>
</div>
</div>
</main>
<script>
"use strict";
const canvas = document.querySelector("#scene");
const ctx = canvas.getContext("2d");
const ink = "#293833";
const TAU = Math.PI * 2;
const rad = degrees => degrees * Math.PI / 180;
const clamp = value => Math.max(0, Math.min(1, value));
const ease = value => { const t = clamp(value); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;

function path(d, fill, stroke, width = 4) {

function oval(x, y, rx, ry, fill, stroke, width = 4, rotation = 0) {

function box(x, y, width, height, radius, fill, stroke, lineWidth = 4) {

function line(x, y, ex, ey, color, width) {

function gradient(y0, y1, ...colors) {

const poses = [

  [2.28,-13,69,9,1], [2.76,-8,82,0,1], [3.52,-11,106,-43,-1],

function poseAt(t) {

function joint(x,y,r) {

function armSegment(x,y,len,angle,width) {

  path(`M18 ${width*.56}L${len-15} 11`,null,"#d88328",6);
  path(`M27 ${-width*.54}L${len-22} -9`,null,"#fff1a0",4);

}
function bucket(x,y,angle,t) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  path("M-13-13Q0-24 13-11L23 6L61 8L48 34Q34 55 4 43Q-15 37-20 14Z","#a85c2e",ink,5);
  path("M-12 2Q9-1 16 12Q27 28 52 14L44 32Q23 49 1 37Q-11 29-12 2Z","#793f29");
  const load = ease((t-2.83)/.55) * (1-ease((t-5.84)/.47));
  if(load>.001) {
    ctx.save(); ctx.translate(18,29); ctx.scale(load,load);
    path("M-20 5Q-29-5-19-12Q-15-19-5-15Q5-27 16-18Q25-23 31-13Q40-9 35 1Q13 18-20 5Z","#a85e32","#693b2a",3);

  armSegment(ex,ey,M,b,20);
  steel(x+18,y-28,mix(x,ex,.63),mix(y,ey,.63)-27);
  steel(mix(x,ex,.78),mix(y,ey,.78)-8,mix(ex,wx,.53)-10,mix(ey,wy,.53)-5);

function machine(t,lever,horn) {

function hornPulse(t) {
  return Math.max(0, ...[8.16,8.66].map(start => {

const play=document.querySelector("#play");
const restart=document.querySelector("#restart");
const seek=document.querySelector("#seek");
const time=document.querySelector("#time");
const sound=document.querySelector("#sound");
let current=0, playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFrame=null, context=null, muted=true;
const horns=[8.16,8.66];
function beep() {
  if(muted || context?.state!=="running") return;
  const now=context.currentTime;
  const gain=context.createGain();
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.075,now+.045);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.32);

  for(const pitch of [342,428]) {
    const tone=context.createOscillator();
    tone.type="triangle";
    tone.frequency.setValueAtTime(pitch*.88,now);
    tone.frequency.exponentialRampToValueAtTime(pitch,now+.06);
    tone.frequency.exponentialRampToValueAtTime(pitch*.91,now+.29);
    tone.connect(gain); tone.start(now); tone.stop(now+.33);
  }

function render() {
  draw(current);

  time.value=current.toFixed(1)+" / 10 秒";

function tick(stamp) {

    if(current>=10) playing=false;
    render();

play.addEventListener("click",()=>{
  if(current>=10) current=0;
  playing=!playing; render();

restart.addEventListener("click",()=>{current=0;playing=true;render();});
seek.addEventListener("input",()=>{current=Number(seek.value);playing=false;render();});
sound.addEventListener("click",async()=>{

    if(!AudioEngine) {sound.textContent="声音不可用";sound.disabled=true;return;}
    try {context ??= new AudioEngine(); await context.resume();}
    catch {sound.textContent="声音不可用";sound.disabled=true;return;}
  }
  muted=!muted;
  sound.setAttribute("aria-pressed",String(!muted));
  sound.textContent=muted?"开启声音":"关闭声音";
});
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
